<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miguelito Chester Pawig Splash Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SPLASH SCREEN — copy everything between the START/END marks
   ============================================================ */
/* ---------- START splash CSS ---------- */
:root{
  --sp-bg:#F4F1E8; --sp-text:#1A2B23; --sp-muted:#5B6B62; --sp-grid:rgba(31,77,58,.07);
  --sp-analyze:#E0603F; --sp-map:#5E9C7E; --sp-build:#1F4D3A; --sp-glow:rgba(31,77,58,.18);
}
[data-theme="dark"]{
  --sp-bg:#0D1411; --sp-text:#EAF2EC; --sp-muted:#8FA79A; --sp-grid:rgba(75,227,161,.06);
  --sp-analyze:#F2775B; --sp-map:#2E9E70; --sp-build:#4BE3A1; --sp-glow:rgba(75,227,161,.35);
}
#splash{
  position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:28px; overflow:hidden;
  background:var(--sp-bg); color:var(--sp-text);
  font-family:'Space Grotesk',system-ui,sans-serif;
}
/* grid + soft vignette */
#splash::before{
  content:""; position:absolute; inset:-40px;
  background-image:linear-gradient(var(--sp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--sp-grid) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 65%);
          mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 65%);
  opacity:0; animation:sp-fade .8s ease-out .1s forwards, sp-drift 6s linear infinite;
}
.sp-stage{position:relative; width:150px; height:138px}
.sp-halo{
  position:absolute; inset:-60px; border-radius:50%;
  background:radial-gradient(circle,var(--sp-glow) 0%,transparent 60%);
  opacity:0; transform:scale(.6);
  animation:sp-halo 1.2s cubic-bezier(.2,.8,.2,1) 1.95s forwards;
}
.sp-logo{position:relative; width:100%; height:100%; overflow:visible}
.sp-bar{transform-box:fill-box; transform-origin:50% 100%; transform:scaleY(0)}
.sp-b1{fill:var(--sp-analyze); animation:sp-grow .55s cubic-bezier(.2,.9,.25,1.15) .55s forwards}
.sp-b2{fill:var(--sp-map);     animation:sp-grow .55s cubic-bezier(.2,.9,.25,1.15) .95s forwards}
.sp-b3{fill:var(--sp-build);   animation:sp-grow .6s  cubic-bezier(.2,.9,.25,1.15) 1.35s forwards}
.sp-bowl{
  fill:none; stroke:var(--sp-build); stroke-width:18; stroke-linecap:round;
  stroke-dasharray:100; stroke-dashoffset:100;
  animation:sp-draw .55s cubic-bezier(.65,0,.35,1) 1.8s forwards;
}
/* scanning beam passes over the mark while it "builds" */
.sp-scan{
  position:absolute; left:-18px; right:-18px; height:2px; bottom:0; opacity:0;
  background:linear-gradient(90deg,transparent,var(--sp-build),transparent);
  box-shadow:0 0 12px var(--sp-build);
  animation:sp-scan 1.3s cubic-bezier(.4,0,.2,1) .5s forwards;
}
.sp-name{
  font-weight:700; font-size:clamp(26px,5vw,34px); letter-spacing:-.5px; line-height:1;
  opacity:0; filter:blur(8px); transform:translateY(8px);
  animation:sp-reveal .7s cubic-bezier(.2,.8,.2,1) 2.15s forwards;
}
.sp-status{
  display:flex; align-items:center; gap:8px; min-height:18px;
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; color:var(--sp-muted);
}
.sp-status b{font-weight:500; color:var(--sp-text)}
.sp-status .ok{color:var(--sp-build)}
.sp-caret{width:7px; height:14px; background:var(--sp-build); animation:sp-blink .9s steps(1) infinite}
.sp-track{width:180px; height:2px; border-radius:2px; background:var(--sp-grid); overflow:hidden}
.sp-fill{
  height:100%; width:100%; transform:scaleX(0); transform-origin:0 50%;
  background:linear-gradient(90deg,var(--sp-analyze),var(--sp-map),var(--sp-build));
  animation:sp-load 2.5s cubic-bezier(.5,0,.2,1) .3s forwards;
}
/* exit */
#splash.sp-out{animation:sp-exit .6s cubic-bezier(.7,0,.3,1) forwards}
#splash.sp-out .sp-stage{animation:sp-lift .6s cubic-bezier(.7,0,.3,1) forwards}

@keyframes sp-fade{to{opacity:1}}
@keyframes sp-drift{to{background-position:0 40px,40px 0}}
@keyframes sp-grow{to{transform:scaleY(1)}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-scan{0%{bottom:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{bottom:100%;opacity:0}}
@keyframes sp-halo{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes sp-reveal{to{opacity:1;filter:blur(0);transform:none}}
@keyframes sp-blink{50%{opacity:0}}
@keyframes sp-load{to{transform:scaleX(1)}}
@keyframes sp-exit{to{opacity:0;visibility:hidden}}
@keyframes sp-lift{to{transform:scale(.88) translateY(-12px);filter:blur(6px)}}

@media (prefers-reduced-motion:reduce){
  #splash *, #splash::before{animation-duration:.01s!important; animation-delay:0s!important}
}
/* ---------- END splash CSS ---------- */

/* ---- demo page only (not needed in your site) ---- */
body{margin:0; background:var(--sp-bg); color:var(--sp-text); font-family:'Space Grotesk',sans-serif; min-height:100vh}
.demo-app{padding:56px 24px; max-width:640px; margin:0 auto}
.demo-app h1{font-size:44px; line-height:1.05; margin:12px 0}
.demo-app p{color:var(--sp-muted); font-size:17px}
.demo-tools{position:fixed; right:16px; bottom:16px; z-index:10000; display:flex; gap:8px}
.demo-tools button{
  font:500 13px 'JetBrains Mono',monospace; padding:12px 16px; min-height:44px; border-radius:10px; cursor:pointer;
  border:1px solid var(--sp-muted); background:var(--sp-bg); color:var(--sp-text);
}
</style>
</head>
<body>

<!-- ---------- START splash HTML (put right after <body>) ---------- -->
<div id="splash" role="status" aria-label="Loading Miguelito Chester Pawig's portfolio">
  <div class="sp-stage">
    <div class="sp-halo"></div>
    <svg class="sp-logo" viewBox="0 0 130 120" aria-hidden="true">
      <rect class="sp-bar sp-b1" x="6"  y="64" width="22" height="50"  rx="11"/>
      <rect class="sp-bar sp-b2" x="38" y="40" width="22" height="74"  rx="11"/>
      <rect class="sp-bar sp-b3" x="70" y="14" width="22" height="100" rx="11"/>
      <path class="sp-bowl" pathLength="100" d="M81 23 H97 A17 17 0 0 1 97 57 H81"/>
    </svg>
    <div class="sp-scan"></div>
  </div>
  <div class="sp-name">Miguelito Chester Pawig</div>
  <div class="sp-status"><span id="sp-text">&gt; booting</span><span class="sp-caret"></span></div>
  <div class="sp-track"><div class="sp-fill"></div></div>
</div>
<!-- ---------- END splash HTML ---------- -->

<!-- demo app behind the splash (replace with your real site) -->
<main class="demo-app">
  <p>Good evening, I'm</p>
  <h1>Miguelito Chester Pawig</h1>
  <p>Back-end Developer &amp; Systems Analyst</p>
</main>
<div class="demo-tools">
  <button type="button" onclick="toggleTheme()">Theme</button>
  <button type="button" onclick="replaySplash()">Replay</button>
</div>

<!-- ---------- START splash JS (put before </body>) ---------- -->
<script>
(function(){
  var MIN_SHOW = 3000;            // ms the intro plays before it can leave
  var start = Date.now();
  var steps = [
    [0,    '&gt; booting'],
    [550,  '&gt; <b>analyze</b>'],
    [950,  '&gt; <b>map</b>'],
    [1350, '&gt; <b>build</b>'],
    [2150, '&gt; status: <span class="ok">ready ✓</span>']
  ];
  var timers = [];

  function run(){
    var el = document.getElementById('sp-text');
    if(!el) return;
    steps.forEach(function(s){
      timers.push(setTimeout(function(){ el.innerHTML = s[1]; }, s[0]));
    });
  }
  function hide(){
    var sp = document.getElementById('splash');
    if(!sp) return;
    var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
    timers.push(setTimeout(function(){
      sp.classList.add('sp-out');
      sp.addEventListener('animationend', function(e){
        if(e.target === sp) sp.style.display = 'none';
      });
    }, wait));
  }
  run();
  if(document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);

  // demo only: replay
  window.replaySplash = function(){
    timers.forEach(clearTimeout); timers = [];
    var sp = document.getElementById('splash');
    var fresh = sp.cloneNode(true);
    fresh.classList.remove('sp-out'); fresh.style.display = '';
    sp.replaceWith(fresh);
    start = Date.now(); run(); hide();
  };
})();
// demo only: theme switch
function toggleTheme(){
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
</script>
<!-- ---------- END splash JS ---------- -->
</body>
</html>
